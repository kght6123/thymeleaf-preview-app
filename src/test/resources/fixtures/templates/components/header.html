<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Header Component</title>
</head>
<body>
    <header th:fragment="navbar">
        <nav>
            <a href="/" th:text="${siteName}">Site Name</a>
            <ul>
                <li><a href="/home">Home</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </nav>
    </header>

    <header th:fragment="simple">
        <h1 th:text="${headerTitle}">Header Title</h1>
    </header>
</body>
</html>
