<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Contact</title>
    <link rel="stylesheet" th:href="@{/assets/assets/css/style.css}"/>
</head>
<body>
    <header th:replace="~{components/header :: header}">Header</header>

    <main class="container">
        <h1 th:text="${title}">Contact Us</h1>
        <p th:text="${subtitle}">Get in touch with us</p>

        <div class="contact-info">
            <div class="contact-item">
                <h3>Email</h3>
                <p th:text="${contact.email}">info@example.com</p>
            </div>
            <div class="contact-item">
                <h3>Phone</h3>
                <p th:text="${contact.phone}">+81-3-1234-5678</p>
            </div>
            <div class="contact-item">
                <h3>Address</h3>
                <p th:text="${contact.address}">Tokyo, Japan</p>
            </div>
        </div>

        <form class="contact-form" th:action="@{/contact}" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required="required"/>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required="required"/>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required="required"></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </main>

    <footer th:replace="~{components/footer :: footer}">Footer</footer>
</body>
</html>
